aid: rox
name: Rox
description: >-
  Rox is an AI-native revenue operating system for enterprise sales teams,
  built around an Agent Swarm layer that turns unified revenue context into
  autonomous go-to-market action. The platform automates pipeline generation,
  account research, prospecting and outreach, meeting briefings, deal
  management and forecasting, running these revenue workflows "on autopilot"
  across a company's book of business. Rox unifies structured and unstructured
  revenue data through a warehouse-native data fabric and connector hub,
  integrating with Salesforce, HubSpot, Gmail, Microsoft Outlook and Graph,
  Slack, Zoom, Snowflake, Databricks and BigQuery, then applies workflow-
  specific agents (research, outreach, deal, meet, monitor) governed by a
  unified permissions engine. Founded in San Francisco by Ishan Mukherjee and
  backed by Sequoia, GV, General Catalyst and 40+ angels, Rox surfaced in the
  API Evangelist network as a portfolio company and is profiled here as a
  product/company profile — it publishes extensive product and engineering
  documentation, a security trust center and a changelog, but no public REST
  API or OpenAPI at the time of enrichment.
