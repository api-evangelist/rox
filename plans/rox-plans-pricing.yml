unit:
  name: Agent Action
  definition: >-
    Rox's fundamental unit of metering. Each task a Rox agent performs (account
    research, people insights, pipeline generation, meeting brief) is counted as
    a defined number of Agent Actions, sized by model complexity and data
    processed. Rox states it charges for the outcome the agents deliver rather
    than for underlying data processing.
