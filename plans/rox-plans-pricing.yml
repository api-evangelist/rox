billing_rules:
- Agent Actions do not roll over; unused actions expire at the end of the cycle.
- Allocation resets on the monthly renewal date for both Starter and Core.
- Mid-cycle upgrade from Starter to Core is allowed; renewal date moves to one
  month from the upgrade date.
- Cancelling Core mid-cycle keeps remaining actions to the end of the period,
  then reverts the account to Starter.
- Always-on features (e.g. Insights) consume Agent Actions and can be tuned down
  to control spend.
