generated: '2026-08-13'
method: searched
source: https://trust.rox.com/
note: >-
  Rox publishes no machine-readable API contract, so every API-shaped
  cross-cutting standard below is recorded as not conformant on the honest
  ground that there is no surface to assert it against — not as a failure of an
  API Rox ships. The security/compliance program entries are real and evidenced
  from the Secureframe-hosted trust center.
conformance:
