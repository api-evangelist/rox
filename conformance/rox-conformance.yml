  name: SOC 2 Type II
  conforms: true
  evidence:
    url: https://trust.rox.com/
    detail: >-
      Listed as an achieved certification with the report and a 2026 manager
      assertion letter available on request behind a click-wrap NDA.
- id: casa-tier-2
  name: App Defense Alliance CASA Tier 2
  conforms: true
  evidence:
    url: https://trust.rox.com/
    detail: Listed as an achieved certification; report available on request.
- id: iso-27001
  name: ISO/IEC 27001
  conforms: false
  status: in-progress
  evidence:
    url: https://trust.rox.com/
    detail: >-
      Only an "ISO27001 Engagement Letter" is offered, i.e. an audit engagement
      rather than a certificate.
- id: gdpr
  name: GDPR / data protection program
  conforms: partial
  evidence:
    url: https://www.rox.com/privacy-policy
    detail: >-
      Rox publishes a privacy policy, a Data Management Policy referenced from
      the subprocessor list, dated named subprocessors, a privacy contact
      (privacy@rox.com) and configurable data-retention settings. No adequacy,
      DPA text or SCC package is published anonymously, so this is recorded as
      a program rather than a verified assertion.
- id: saml2
  name: SAML 2.0 SSO
  conforms: true
  evidence:
    url: https://docs.rox.com/development/engineering/docs/rox-enterprise-integrations/enterprise-sso-via-auth0
    detail: >-
      Enterprise SSO via Auth0 supports SAML identity providers (Okta named);
      self-serve configuration since 2026-07-01.
- id: oidc
  name: OpenID Connect
  conforms: true
  evidence:
    url: https://docs.rox.com/development/engineering/docs/rox-enterprise-integrations/enterprise-sso-via-auth0
    detail: >-
      Enterprise SSO supports OpenID Connect connections (Okta, Microsoft Entra
      ID). No OIDC discovery document is served on any rox.com host — the Auth0
      tenant is not published.
- id: oauth2
  name: OAuth 2.0
  conforms: partial
  evidence:
    url: https://docs.rox.com/development/engineering/docs/rox-enterprise-integrations
    detail: >-
      Rox CONSUMES OAuth-based org-wide authorization grants (Microsoft Graph,
      Google Workspace, Zoom, Slack, Salesforce). Rox does not act as an OAuth
      authorization server for third-party developers.
- id: rfc9116
  name: security.txt
